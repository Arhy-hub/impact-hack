<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f9">
<title>Heatwise</title>
<style>
  :root { --bg:#f4f5f9; --card:#fff; --ink:#1c1d22; --muted:#6b6f7b; --line:#e7e8ee;
          --blue:#3c55f0; --blue-soft:#eef0ff; --heat:#f07a24; --heat-soft:#fff1e6;
          --good:#1f9d63; --good-soft:#e6f6ee; --bad:#d6334a; --bad-soft:#fdecef; --shadow:0 2px 10px rgba(20,24,60,.06); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#121318; --card:#1c1e25; --ink:#f1f2f6; --muted:#a2a6b3; --line:#2b2e38;
      --blue:#8b9bff; --blue-soft:#23284a; --heat-soft:#3a2617; --good-soft:#15301f; --bad-soft:#3a1820; --shadow:none; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; }
  .phone { max-width:440px; margin:0 auto; padding:18px 16px 40px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:8px 0 4px; }
  h1 { font:700 27px/1.15 Georgia, "Times New Roman", serif; margin:0; letter-spacing:-.5px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:14px; }
  .toggle { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); background:none; border:0; cursor:pointer; padding:0; }
  .switch { width:52px; height:30px; border-radius:15px; background:var(--line); position:relative; transition:.2s; }
  .switch::after { content:"🚶"; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
                   background:#fff; box-shadow:var(--shadow); display:grid; place-items:center; font-size:13px; transition:.2s; }
  .toggle[aria-pressed="true"] .switch { background:var(--blue); }
  .toggle[aria-pressed="true"] .switch::after { left:25px; }
  .card { background:var(--card); border-radius:18px; padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .chip { font-size:13px; padding:5px 11px; border-radius:999px; background:var(--card); box-shadow:var(--shadow); }
  .chip.cheap { background:var(--good-soft); color:var(--good); }
  .chip.peak { background:var(--bad-soft); color:var(--bad); }
  .demo { border:1.5px dashed var(--line); border-radius:14px; padding:8px 10px; margin-bottom:14px; font-size:13px; color:var(--muted); }
  .demo .row { flex-wrap:wrap; }
  .demo b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .btn { font:inherit; font-size:15px; font-weight:600; border:0; border-radius:12px; padding:10px 16px;
         background:var(--blue-soft); color:var(--blue); cursor:pointer; }
  .btn.small { font-size:13px; padding:6px 10px; border-radius:9px; }
  .btn.solid { background:var(--blue); color:#fff; }
  .btn:focus-visible, .toggle:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
  .room-name { display:flex; align-items:center; gap:10px; font-size:18px; }
  .icon { width:34px; height:34px; border-radius:50%; background:var(--bg); display:grid; place-items:center; font-size:16px; }
  .target { font-size:16px; color:var(--muted); } .target b { color:var(--ink); font-size:19px; }
  .temp { font-size:52px; font-weight:300; letter-spacing:-2px; line-height:1; margin-top:12px; }
  .actual { color:var(--muted); font-size:13px; }
  .status { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:4px 10px;
            border-radius:999px; background:var(--bg); color:var(--muted); margin-top:8px; }
  .status.heating { background:var(--heat-soft); color:var(--heat); }
  .why { font-size:13px; color:var(--muted); margin:10px 0 0; display:none; }
  .why.open { display:block; }
  .link { background:none; border:0; color:var(--blue); font:inherit; font-size:13px; cursor:pointer; padding:0; margin-top:8px; }
  .bar { height:10px; background:var(--bg); border-radius:5px; position:relative; overflow:hidden; margin:10px 0 6px; }
  .bar .fill { position:absolute; inset:0 auto 0 0; background:var(--blue); border-radius:5px; }
  .bar .proj { position:absolute; inset:0 auto 0 0; background:var(--blue-soft); }
  .big { font-size:26px; font-weight:700; }
  .alert { background:var(--bad-soft); color:var(--bad); border-radius:12px; padding:10px 12px; font-size:14px; margin-top:10px; }
  .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  h2 { font-size:17px; margin:0 0 10px; }
  .plan { display:grid; grid-template-columns:70px 1fr; gap:4px 8px; font-size:12px; align-items:center; }
  .cells { display:grid; grid-template-columns:repeat(24, 1fr); gap:2px; }
  .cell { height:14px; border-radius:3px; background:var(--line); }
  .cell.heat { background:var(--heat); } .cell.eco { background:var(--heat-soft); }
  .cell.cheap { background:var(--good); opacity:.55; } .cell.peak { background:var(--bad); opacity:.55; } .cell.normal { background:var(--line); }
  .hours { display:grid; grid-template-columns:repeat(24, 1fr); font-size:10px; color:var(--muted); }
  .events { display:flex; flex-direction:column; gap:6px; margin-top:12px; font-size:13px; }
  .event { display:flex; gap:8px; align-items:center; } .event .when { color:var(--muted); min-width:92px; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin-top:10px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  ul.tips { margin:0; padding-left:18px; font-size:14px; } ul.tips li { margin-bottom:6px; }
  .foot { text-align:center; color:var(--muted); font-size:12px; margin-top:16px; }
  #error { display:none; }
</style>
</head>
<body>
<div class="phone">
  <header>
    <h1 id="greeting">Heatwise</h1>
    <button class="toggle" id="away" aria-pressed="false" aria-label="Away mode"><span>Away</span><span class="switch"></span></button>
  </header>
  <div class="sub" id="sub"></div>
  <div class="chips" id="chips"></div>

  <div class="demo">
    <div class="row">
      <span>Demo clock · <b id="clock"></b></span>
      <span>
        <button class="btn small" data-tick="1">+15m</button>
        <button class="btn small" data-tick="4">+1h</button>
        <button class="btn small" id="play">▶ Play</button>
        <button class="btn small" id="reset" title="Start the week again">↺</button>
      </span>
    </div>
  </div>

  <div class="card alert" id="error">Can't reach the Heatwise server. Is <code>uvicorn heatwise.app:app</code> running?</div>
  <div id="rooms"></div>

  <div class="card" id="budget">
    <div class="row"><h2 style="margin:0">Budget <span class="actual" id="period"></span></h2><span class="actual" id="supplier"></span></div>
    <div class="row" style="margin-top:8px"><span class="big" id="spent"></span><span class="actual" id="ofBudget"></span></div>
    <div class="bar"><div class="proj" id="projBar"></div><div class="fill" id="spentBar"></div></div>
    <div class="actual" id="budgetLine"></div>
    <div id="budgetAlert"></div>
  </div>

  <div class="card">
    <h2>Today's plan</h2>
    <div class="plan" id="plan"></div>
    <div class="legend">
      <span><i style="background:var(--heat)"></i>Heating</span><span><i style="background:var(--heat-soft)"></i>Eco</span>
      <span><i style="background:var(--line)"></i>Off / frost</span>
      <span><i style="background:var(--good);opacity:.55"></i>Cheap &amp; clean</span><span><i style="background:var(--bad);opacity:.55"></i>Peak</span>
    </div>
    <div class="events" id="events"></div>
  </div>

  <div class="card" id="tipsCard"><h2>Tips</h2><ul class="tips" id="tips"></ul></div>

  <div class="foot" id="foot"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const NAMES = { living: "Living room", kitchen: "Kitchen", bedroom: "Bedroom" };
const ICONS = { living: "🛋️", kitchen: "🍳", bedroom: "🛏️" };
const openWhy = new Set();

// Small DOM helper: text only via textContent, never innerHTML.
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "style") e.style.cssText = v;
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid.nodeType ? kid : String(kid));
  return e;
}

async function call(path, body) {
  const opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  try {
    const r = await fetch(path, opts);
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    $("error").style.display = "none";
    render(data);
    return data;
  } catch (err) {
    console.error(err);
    $("error").style.display = "block";
  }
}

function roomCard(r) {
  const name = NAMES[r.name] || r.name;
  const status = h("span", { class: "status" + (r.heating ? " heating" : "") }, (r.heating ? "🔥 Heating · " : "") + r.status);
  const why = h("p", { class: "why" + (openWhy.has(r.name) ? " open" : "") }, r.why);
  const boost = r.boost_until
    ? h("button", { class: "btn", onclick: () => call("/api/boost/cancel", { room: r.name }) }, `Cancel boost · ${r.boost_until.slice(-5)}`)
    : h("button", { class: "btn", onclick: () => call("/api/boost", { room: r.name, hours: 1 }) }, "◎ Boost 1h");
  return h("div", { class: "card" },
    h("div", { class: "row" },
      h("div", { class: "room-name" }, h("span", { class: "icon" }, ICONS[r.name] || "🌡️"), name),
      h("div", { class: "target" }, "Target ", h("b", {}, r.target.toFixed(1) + "°"))),
    h("div", { class: "row", style: "align-items:flex-end" },
      h("div", {}, h("div", { class: "temp" }, r.temp.toFixed(1) + "°"), h("div", { class: "actual" }, "Actual"), status),
      boost),
    h("button", { class: "link", onclick: () => { openWhy.has(r.name) ? openWhy.delete(r.name) : openWhy.add(r.name); why.classList.toggle("open"); } }, "Why?"),
    why);
}

function render(s) {
  $("greeting").textContent = s.greeting;
  $("sub").textContent = new Date(s.date + "T00:00:00").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }) +
    (s.calendar.now.length ? " · " + s.calendar.now.join(", ") : "");
  $("clock").textContent = s.clock + (s.finished ? " (end of week)" : "");
  $("away").setAttribute("aria-pressed", s.away);

  const level = { cheap: "Cheap & clean now", normal: "Normal price", peak: "Peak price now" }[s.price_level];
  $("chips").replaceChildren(
    h("span", { class: "chip" }, `🌡️ ${s.outside_c.toFixed(1)}° outside`),
    h("span", { class: "chip " + s.price_level }, `⚡ ${level} · ${s.price_p.toFixed(0)}p`),
    h("span", { class: "chip" }, `🌍 ${s.carbon_g} g CO₂/kWh`));

  $("rooms").replaceChildren(...s.rooms.map(roomCard));

  const b = s.budget;
  $("period").textContent = "· " + b.period;
  $("supplier").textContent = b.supplier === "solvapay" ? "Paid via SolvaPay" : "Paid via SolvaPay (demo)";
  $("spent").textContent = "£" + b.spent_gbp.toFixed(2);
  $("ofBudget").textContent = "of £" + b.budget_gbp.toFixed(2);
  $("spentBar").style.width = Math.min(100, 100 * b.spent_gbp / b.budget_gbp) + "%";
  $("projBar").style.width = Math.min(100, 100 * b.projected_gbp / b.budget_gbp) + "%";
  $("budgetLine").textContent = `On track for £${b.projected_gbp.toFixed(2)} · ${b.co2_kg.toFixed(1)} kg CO₂ so far` +
    (b.credit_left_gbp != null ? ` · £${b.credit_left_gbp.toFixed(2)} credit left` : "") +
    (b.auto_trim + b.manual_trim > 0 ? ` · comfort trimmed ${Math.min(3, b.auto_trim + b.manual_trim)}°` : "");
  const alertBox = $("budgetAlert");
  if (b.needs_topup) {
    alertBox.replaceChildren(h("div", { class: "alert" }, "Out of credit. Safety heating only (12°) until you top up."),
      h("div", { class: "actions" }, h("button", { class: "btn solid", onclick: () => topup(10) }, "Top up £10")));
  } else if (b.over_budget) {
    alertBox.replaceChildren(h("div", { class: "alert" }, `Heading £${(b.projected_gbp - b.budget_gbp).toFixed(2)} over budget this week.`),
      h("div", { class: "actions" },
        h("button", { class: "btn solid", onclick: () => topup(10) }, "Top up £10"),
        h("button", { class: "btn", onclick: () => call("/api/trim", { degrees: Math.min(3, b.manual_trim + 1) }) }, "Trim 1° more")));
  } else {
    alertBox.replaceChildren(b.manual_trim > 0
      ? h("div", { class: "actions" }, h("button", { class: "btn small", onclick: () => call("/api/trim", { degrees: 0 }) }, "Remove my trim"))
      : "");
  }

  const p = s.plan;
  const rows = [h("span", { class: "actual" }, "Price"), h("div", { class: "cells" }, p.price.map(l => h("div", { class: "cell " + l, title: l })))];
  for (const [name, cells] of Object.entries(p.rooms)) {
    rows.push(h("span", {}, NAMES[name] || name), h("div", { class: "cells" }, cells.map(c => h("div", { class: "cell " + c, title: c }))));
  }
  rows.push(h("span", {}), h("div", { class: "hours" }, p.hours.map((l, i) => h("span", {}, i % 6 === 0 ? l : ""))));
  $("plan").replaceChildren(...rows);
  const start = s.clock;
  $("events").replaceChildren(...(p.events.length ? p.events.map(e => h("div", { class: "event" },
    h("span", { class: "when" }, e.from_h < 0.01 ? "now" : `in ${e.from_h.toFixed(e.from_h < 10 ? 1 : 0)} h`),
    h("span", {}, "📅 " + e.title + (e.kind ? ` · ${({ away: "away", wfh: "working from home", guests: "guests" })[e.kind]}` : ""))))
    : [h("span", { class: "actual" }, "Nothing in your calendar for the next 24 hours.")]));

  $("tips").replaceChildren(...(s.tips.length ? s.tips.map(t => h("li", {}, t)) : [h("li", {}, "All good. Nothing to do.")]));
  $("foot").textContent = `Prices: ${s.signals_source} · Calendar: ${s.calendar.source === "google" ? "Google Calendar" : "demo week"}` +
    (s.calendar.error ? " (couldn't load yours)" : "") + " · Simulated home";
}

async function topup(pounds) {
  const s = await call("/api/topup", { pounds });
  if (s && s.result && !s.result.paid && s.result.checkout_url) window.open(s.result.checkout_url, "_blank", "noopener");
}

$("away").onclick = () => call("/api/away", { on: $("away").getAttribute("aria-pressed") !== "true" });
document.querySelectorAll("[data-tick]").forEach(b => b.onclick = () => call("/api/tick", { steps: Number(b.dataset.tick) }));
$("reset").onclick = () => { stop(); call("/api/reset", {}); };
let timer = null;
const stop = () => { clearInterval(timer); timer = null; $("play").textContent = "▶ Play"; };
$("play").onclick = () => {
  if (timer) return stop();
  $("play").textContent = "⏸ Pause";
  timer = setInterval(async () => { const s = await call("/api/tick", { steps: 2 }); if (!s || s.finished) stop(); }, 700);
};
call("/api/home");
</script>
</body>
</html>
